<!doctype html><html lang="sk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zálohy skenov</title><style>body{font:15px system-ui;max-width:1200px;margin:30px auto;padding:0 18px;color:#23483b;background:#f3f6f1}section{background:white;padding:24px;border-radius:14px;margin:20px 0}input,button{font:inherit;padding:10px;border:1px solid #becdc3;border-radius:6px;margin:5px}button{background:#154e43;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd;overflow-wrap:anywhere}label{display:inline-block}#wrap{overflow:auto}#message{white-space:pre-wrap} [hidden]{display:none!important}</style><h1>Serverové zálohy skenov</h1><p>Úložisko CRM / Dochádzka · Meno skenujúceho je zadané používateľom, nejde o overené prihlásenie.</p><section id="login"><h2>Prihlásenie administrátora CRM</h2><form id="loginform"><input id="username" autocomplete="username" required placeholder="Login" aria-label="Login"><input id="password" type="password" autocomplete="current-password" required placeholder="Heslo" aria-label="Heslo"><button>Prihlásiť</button></form></section><section id="panel" hidden><h2>Spoločný prehľad</h2><form id="filters"><label>Meno <input id="operator" maxlength="120"></label><label>Paleta <input id="pallet" type="number" min="1"></label><label>Od (UTC) <input id="since" type="date"></label><label>Do (UTC) <input id="until" type="date"></label><button>Filtrovať</button></form><button id="export">Export všetkých filtrovaných do Excelu</button><button id="logout">Odhlásiť</button><div id="wrap"><table><thead><tr><th>Meno</th><th>Paleta / box / diel</th><th>Kód</th><th>Poznámka</th><th>Čas skenu (UTC)</th><th>Zariadenie</th></tr></thead><tbody id="rows"></tbody></table></div><button id="previous">Predchádzajúce</button><button id="next">Ďalšie</button></section><p id="message" role="status"></p><script>
let token='',offset=0;const $=id=>document.getElementById(id);function params(){const p=new URLSearchParams();for(const key of ['operator','pallet','since','until'])if($(key).value)p.set(key,$(key).value);return p;}async function request(url){const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error(r.status===401||r.status===403?'Prihlásenie vypršalo alebo účet nemá oprávnenie administrátora.':'Server vrátil chybu '+r.status);return r;}async function load(){try{const p=params();p.set('offset',offset);const d=await(await request('/scanner/api/admin/records?'+p)).json();$('rows').replaceChildren();for(const r of d.records){const tr=document.createElement('tr');for(const v of [r.operator,[r.pallet,r.box,r.piece].map(x=>x??'—').join(' / '),r.code,r.note,r.at,r.device]){const td=document.createElement('td');td.textContent=v;tr.append(td);}$('rows').append(tr);}$('previous').disabled=offset===0;$('next').disabled=!d.more;$('message').textContent=d.records.length+' záznamov na tejto strane. Serverové zálohy sa vymazaním lokálnych skenov neodstraňujú.';}catch(e){$('message').textContent=e.message;}}
$('loginform').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:$('username').value,password:$('password').value})});$('password').value='';if(!r.ok)throw Error('Nesprávne prihlasovacie údaje.');token=(await r.json()).access_token;await request('/scanner/api/admin/records?limit=1');$('login').hidden=true;$('panel').hidden=false;await load();}catch(e){token='';$('message').textContent=e.message;}};$('filters').onsubmit=e=>{e.preventDefault();offset=0;load();};$('previous').onclick=()=>{offset=Math.max(0,offset-200);load();};$('next').onclick=()=>{offset+=200;load();};$('logout').onclick=()=>{token='';$('rows').replaceChildren();$('panel').hidden=true;$('login').hidden=false;$('message').textContent='Odhlásené.';};$('export').onclick=async()=>{try{const r=await request('/scanner/api/admin/export?'+params()),url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download='skeny-server.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(e){$('message').textContent=e.message;}};
</script></html>
