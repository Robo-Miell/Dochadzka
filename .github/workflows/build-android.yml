Backendové CRUD operácie som aj otestoval na testovacej databáze — zmena zamestnanca a hesla, zmena prevádzky, vytvorenie/upravenie/zmazanie dochádzky aj následné mazanie fungovali. Existujúcu databázu netreba prerábať, pretože som nepridával nové databázové stĺpce ani tabuľky.

Veľkosť Android aplikácie

Tvoje súčasné app-release.apk má v skutočnosti približne 52 MB. Nový workflow už nevyrába iba tento univerzálny APK, ale napríklad app-arm64-v8a-release.apk pre väčšinu dnešných Android telefónov. To by malo veľkosť veľmi výrazne znížiť. Presných < 21 MB ti však nechcem sľúbiť bez reálneho Flutter buildu — v tomto prostredí Flutter SDK nemám. Workflow po spustení na GitHube vypíše presnú veľkosť každého APK. Flutter dokumentácia potvrdzuje, že --split-per-abi odstraňuje z jednotlivého APK nepotrebné architektúry.

iPhone / iOS

iOS verzia je v projekte pripravená a pridal som aj GitHub workflow, ktorý overí a vytvorí nepodpísaný iOS build. Na normálnu inštaláciu do iPhonu, TestFlight alebo App Store však potrebujeme ešte Apple Developer účet a Apple code signing. iOS Flutter buildovanie vyžaduje macOS/Xcode.

Ako ďalší krok by som navrhoval, aby sme teraz spolu spravili nasadenie tejto v4 na tvoj GitHub a Render a potom spustili nový Android build. Keď sa APK zostaví, uvidíme jeho presnú veľkosť a prípadne ho ešte ďalej zmenšíme.

