Robo-Miell/Dochadzka
Chcem, aby ked sa prihlasim ako admin vedel vsetko upravovať. Ci uz zamestnancov(napríklad zmenit heslo), zavody(zmenit vsetko) alebo samotnú dochádzku(upravovat casy, odstranovat jednotlive zaznamy). Dalej by som chcel aby samotná aplikácia mala logo, ktore pripajam v prilohe. A taktiez by som chcel, aby aplikácia mala menej oki 21MB. V aplikácii by malo zobrazovať vzdy aktuálny mesiac s moznostou zmeny mesiaca. Potom by som chcel aby bola aplikácia aj pre iOS.

Áno — pripravil som prvú upravenú verziu podľa tvojich požiadaviek.

Urobil som tieto zmeny:

Admin vie upravovať zamestnanca vrátane osobného čísla, mena, loginu, nového hesla, prevádzky a aktivity. Vie zamestnanca aj odstrániť, pokiaľ nemá naviazanú dochádzku.
Prevádzky/závody sa dajú vytvárať, kompletne upravovať a nepoužité aj odstrániť.
Dochádzka sa dá vytvárať za zamestnanca, upraviť dátum, zamestnanca, závod, typ, čas od/do, prestávku, poznámku aj stav a jednotlivý záznam odstrániť.
Rovnakú administráciu som doplnil aj priamo do mobilnej aplikácie pre admin účet.
Do webu aj aplikácie som vložil MIELL Quality branding a vytvoril som z dodaného loga aj ikonu Android/iOS aplikácie.
Zamestnancovi aplikácia po otvorení automaticky ukazuje aktuálny mesiac. Mesiac môže meniť šípkami alebo ťuknutím na názov mesiaca.
Súčet schválených hodín a čakajúcich záznamov sa počíta len za vybraný mesiac.
Android build som zmenil z jedného veľkého „fat APK“ na samostatné APK podľa procesora a doplnil --split-debug-info. Flutter tento spôsob odporúča práve preto, že univerzálne APK obsahuje binárky pre viac architektúr a je výrazne väčšie.
Doplnil som iOS build workflow. Zdroj je spoločný pre Android aj iOS.

