KROK 21 — opravíme Android workflow

Na GitHube otvor:

.github
→ workflows
→ build-android.yml

Klikni vpravo hore na ceruzku / Edit this file.

Nájdi túto časť:

      - name: Generate MIELL app icon
        working-directory: mobile_flutter
        run: dart run flutter_launcher_icons

A celú ju nahraď týmto:

      - name: Generate MIELL app icon
        working-directory: mobile_flutter
        run: |
          sed -i 's/  ios: true/  ios: false/' pubspec.yaml
          dart run flutter_launcher_icons

Tým pri Android builde dočasne vypneme generovanie iOS ikon. Tvoj skutočný pubspec.yaml v repozitári sa tým nezmení — zmena sa udeje iba počas buildu na GitHub serveri.

